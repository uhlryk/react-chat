name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run lint:package
      - run: npm test
      - name: the packed package loads from outside, CommonJS, ES module and the stylesheet
        run: |
          npm pack
          mkdir -p ../consumer && cd ../consumer && npm init -y >/dev/null
          npm install react@19 react-dom@19 ../react-chat/*.tgz
          node -e "const c = require('@krzysztofsztompka/react-chat'); if (typeof c.Chat !== 'function') process.exit(1)"
          node --input-type=module -e "import { Chat, ItemMessage } from '@krzysztofsztompka/react-chat'; if (typeof Chat !== 'function' || typeof ItemMessage !== 'function') process.exit(1)"
          node -e "require('node:fs').statSync(require.resolve('@krzysztofsztompka/react-chat/styles.css'))"
      - name: an empty Vite app, with no Tailwind, builds the packed package with its stylesheet
        run: |
          cp -r test/vite-app ../vite-app && cd ../vite-app
          npm install ../react-chat/*.tgz
          npm run build
          grep -q 'react-chat__thread' dist/assets/*.css
          grep -q 'react-chat__thread' dist/assets/*.js
