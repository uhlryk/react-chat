name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: the packed package loads from outside, CommonJS and ES module
        run: |
          npm pack
          mkdir -p ../consumer && cd ../consumer && npm init -y >/dev/null
          npm install react@19 react-dom@19 ../react-chat/*.tgz
          node -e "const c = require('@krzysztofsztompka/react-chat'); if (typeof c.Chat !== 'function') process.exit(1)"
          node --input-type=module -e "import { Chat, ItemMessage } from '@krzysztofsztompka/react-chat'; if (typeof Chat !== 'function' || typeof ItemMessage !== 'function') process.exit(1)"
